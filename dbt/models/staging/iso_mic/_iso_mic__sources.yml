version: 2

sources:
  - name: iso_mic
    schema: raw
    config:
      loaded_at_field: ingested_at
    tables:
      - name: iso_mic
        config:
          freshness: null # add freshness check both on publication date and ingested_at
        columns:
          - name: mic
            data_type: string
            data_tests:
              - unique
              - not_null
              - dbt_utils.not_empty_string

          - name: operating_mic
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: oprt_sgmt
            data_type: string
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['OPRT', 'SGMT']
              - dbt_utils.not_empty_string  

          - name: market_name_institution_description
            data_type: string

          - name: legal_entity_name
            data_type: string

          - name: lei
            data_type: string
            data_tests:
              # ISO's file carries exactly 5 LEIs destroyed by Excel
              # (3.16E+19 notation, Czech venues) -- a known upstream defect.
              - valid_lei:
                  config:
                    warn_if: '>0'
                    error_if: '>10'

          - name: market_category_code
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: iso_country_code
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: city
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: status
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
              - accepted_values:
                  arguments:
                    values: ['ACTIVE', 'UPDATED', 'EXPIRED']

          - name: creation_date
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: last_update_date
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string

          - name: last_validation_date
            data_type: string

          - name: expiry_date
            data_type: string

          - name: source_file
            data_type: string

          - name: publication_date
            data_type: string

          - name: ingested_at
            data_type: string