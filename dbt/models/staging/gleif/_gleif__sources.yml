version: 2

sources:
  - name: gleif
    schema: raw
    config:
      loaded_at_field: ingested_at
    tables:
      - name: gleif_entity
        config:
          freshness: null # add freshness check both on publication_date and ingested_at
        columns:
          - name: lei
            data_type: string
            data_tests:
              - unique
              - not_null
              - dbt_utils.not_empty_string
          - name: legal_name
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: legal_country
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: legal_city
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: hq_country
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: hq_city
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: legal_jurisdiction
            data_type: string
          - name: entity_category
            data_type: string
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - GENERAL
                      - FUND
                      - SOLE_PROPRIETOR
                      - RESIDENT_GOVERNMENT_ENTITY
                      - BRANCH
                      - INTERNATIONAL_ORGANIZATION
          - name: legal_form_code
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: entity_status
            data_type: string
            data_tests:
              # 'NULL' is quoted deliberately: GLEIF publishes the literal
              # string NULL as an enum token (8,971 rows measured). Unquoted,
              # YAML would parse it as a real null inside the IN list.
              - accepted_values:
                  arguments:
                    values: ['ACTIVE', 'INACTIVE', 'NULL']
          - name: entity_creation_date
            data_type: string
          - name: successor_lei
            data_type: string
          - name: registration_status
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
              - accepted_values:
                  arguments:
                    values:
                      - ISSUED
                      - LAPSED
                      - RETIRED
                      - DUPLICATE
                      - ANNULLED
                      - PENDING_TRANSFER
                      - PENDING_ARCHIVAL
          - name: initial_registration_date
            data_type: string
          - name: last_update_date
            data_type: string
          - name: next_renewal_date
            data_type: string
          - name: managing_lou
            data_type: string
          - name: conformity_flag
            data_type: string
          - name: source_file
            data_type: string
          - name: publication_date
            data_type: string
          - name: ingested_at
            data_type: string

      - name: gleif_relationship
        config:
          freshness: null # add freshness check both on publication_date and ingested_at
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - child_lei
                  - parent_lei
                  - relationship_type
        columns:
          - name: child_lei
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: child_id_type
            data_type: string
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['LEI']
          - name: parent_lei
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: parent_id_type
            data_type: string
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['LEI']
          - name: relationship_type
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
              - accepted_values:
                  arguments:
                    values:
                      - IS_FUND-MANAGED_BY
                      - IS_ULTIMATELY_CONSOLIDATED_BY
                      - IS_DIRECTLY_CONSOLIDATED_BY
                      - IS_SUBFUND_OF
                      - IS_INTERNATIONAL_BRANCH_OF
                      - IS_FEEDER_TO
          - name: relationship_status
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
              # same literal-string token as entity_status: 336 rows of 'NULL'
              - accepted_values:
                  arguments:
                    values: ['ACTIVE', 'INACTIVE', 'NULL']
          - name: rel_start_date
            data_type: string
          - name: rel_end_date
            data_type: string
          - name: source_file
            data_type: string
          - name: publication_date
            data_type: string
          - name: ingested_at
            data_type: string
