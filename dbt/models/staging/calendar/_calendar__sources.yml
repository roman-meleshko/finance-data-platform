version: 2

sources:
  - name: calendar
    schema: raw
    config:
      loaded_at_field: ingested_at
    tables:
      - name: calendar
        config:
          freshness: null # add freshness check both on publication date and ingested_at
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - calendar_code
                  - calendar_date
        columns:
          - name: calendar_code
            data_type: string
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['TARGET', 'XFRA']
              - dbt_utils.not_empty_string
              
          - name: calendar_date
            data_type: string
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
              
          - name: is_trading_day
            data_type: boolean
            data_tests:
              - not_null
              
          - name: source_file
            data_type: string
              
          - name: publication_date
            data_type: string
              
          - name: ingested_at
            data_type: string
