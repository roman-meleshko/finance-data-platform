name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m sqlfluff lint dbt/
      - run: python -m pytest tests/ -q
      - name: Write keyfile
        run: echo "$GCP_SA_KEY" > /tmp/key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      - name: Compile against the warehouse
        if: github.event_name == 'pull_request'
        run: cd dbt && dbt deps && dbt build --empty --target ci
        env:
          GCP_KEYFILE: /tmp/key.json
      - name: Full build on merge
        if: github.event_name == 'push'
        run: cd dbt && dbt deps && dbt build --target ci
        env:
          GCP_KEYFILE: /tmp/key.json
